<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Works</title>
    <link rel="stylesheet"
          href="works.css">
             <link rel="stylesheet" href="cursor.css">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300..700&family=Pacifico&family=Pangolin&family=Sekuya&family=Winky+Rough:wght@300..900&family=Zen+Old+Mincho&display=swap"
          rel="stylesheet">
</head>
<body>
    <div class="bg2"></div>
    <img id="navigation-bar"
         src="all-assets/navigation-bar.svg"
         alt="Navigation">
    <img id="fork"
         src="all-assets/fork.png"
         alt="Fork">
    <img id="knife"
         src="all-assets/knife.png"
         alt="Knife">
    <img id="arrow-1"
         src="all-assets/arrow-1.svg"
         alt="Next">
    <img id="arrow-2"
         src="all-assets/arrow-2.svg"
         alt="Previous">
    <img id="dish"
         src="all-assets/dish.png"
         alt="Illustrations">
    <img id="cd-cover"
         src="all-assets/cd-cover.gif"
         alt="Illustrations CD">
    <img id="dish-1"
         src="all-assets/dish-1.png"
         alt="Video 1">
    <img id="cd-cover-1"
         src="all-assets/cd-cover-1.gif"
         alt="Video 1 CD">
    <img id="dish-2"
         src="all-assets/dish-2.png"
         alt="Video 2">
    <img id="cd-cover-2"
         src="all-assets/cd-cover-2.gif"
         alt="Video 2 CD">
    <div id="illustration-board">
        <div class="board">
            <div class="board-inner">
                <div class="board-header">
                    <div class="board-title">
                        ILLUSTRATIONS - DIGITAL
                    </div>
                    <button id="close-board"
                            type="button">
                        ✕
                    </button>
                </div>
                <div class="gallery-scroll">
                    <div class="gallery-grid">
                        <img id="mywork"
                             src="all-assets/myworks.png"
                             alt="My work">
                        <img id="mywork-1"
                             src="all-assets/mywork-1.png"
                             alt="My work 1">
                        <img id="mywork-2"
                             src="all-assets/mywork-2.jpg"
                             alt="My work 2">
                        <img id="mywork-3"
                             src="all-assets/mywork-3.jpg"
                             alt="My work 3">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="youtube-popup">
        <div id="youtube-box">
            <button id="youtube-close"
                    type="button"
                    aria-label="Close">
                ×
            </button>
            <a id="youtube-link"
               href="#"
               target="_blank"
               rel="noopener noreferrer">
                <div id="youtube-preview">
                    <div id="youtube-play">
                        ▶
                    </div>
                    <div id="youtube-text">
                        WATCH ON YOUTUBE
                    </div>
                </div>
            </a>
        </div>
    </div>
    <nav class="nav-menu">
        <div class="nav-item">
            <img id="rectangle"
                 src="all-assets/rectangle.svg"
                 alt="About">
            <div class="text"
                 id="ABOUT">
                ABOUT
            </div>
        </div>
        <div class="nav-item active">
            <img id="rectangle-1"
                 src="all-assets/rectangle-1.svg"
                 alt="Works">
            <div class="text"
                 id="WORKS">
                WORKS
            </div>
        </div>
        <div class="nav-item">
            <img id="rectangle-2"
                 src="all-assets/rectangle-2.svg"
                 alt="Contact">
            <div class="text"
                 id="CONTACT">
                CONTACT
            </div>
        </div>
    </nav>
<img id="MY"
src="all-assets/MY.gif" alt="MY">
<img id="AN"
src="all-assets/AN.gif" alt="AN">
    <button id="hamburger-btn"
            type="button"
            aria-label="Open menu">
        ☰
    </button>
    <div id="mobile-menu">
        <a href="aboutme.html">
            ABOUT
        </a>
        <a href="works.html">
            WORKS
        </a>
        <a href="contact.html">
            CONTACT
        </a>
    </div>
      <div id="star-field"></div>
    <script src="works.js"></script>
    <script src="cursor.js"></script>
</body>
</html>
